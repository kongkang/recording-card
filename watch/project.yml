name: RecordingCardWatch
options:
  xcodeVersion: "15.4"
  projectFormat: xcode14_0
  bundleIdPrefix: com.reai
  createIntermediateGroups: true
  defaultConfig: Release
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  WatchRecorderCore:
    path: Packages/WatchRecorderCore

targets:
  RecordingCardWatchCompanion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: CompanionApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_COMPANION_BUNDLE_ID)
        PRODUCT_NAME: RecordingCardWatchCompanion
        INFOPLIST_FILE: CompanionApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: CompanionApp/CompanionApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: WatchRecorderCore
      - target: RecordingCardWatchApp
        embed: true
    scheme: {}

  RecordingCardWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_APP_BUNDLE_ID)
        PRODUCT_NAME: RecordingCardWatchApp
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/WatchApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - package: WatchRecorderCore
      - target: RecordingCardWatchWidgets
        embed: true
    scheme: {}

  RecordingCardWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: WatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_WIDGETS_BUNDLE_ID)
        PRODUCT_NAME: RecordingCardWatchWidgets
        INFOPLIST_FILE: WatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/WatchWidgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: WatchRecorderCore
