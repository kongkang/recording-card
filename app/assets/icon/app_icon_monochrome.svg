<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android 13+ 主题图标（monochrome）层：单色剪影，波形与录音点做成镂空。
  系统会按主题取色渲染，因此这里只画不透明形状，颜色值本身无意义。
  画布与安全区同前景层（108×108dp，内容收在中心 66%）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <!-- 白=保留，黑=镂空（mask 在 1024 参考坐标系内定义，随外层 group 一起缩放） -->
    <mask id="rcMonoCut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="258" y="452" width="60" height="120" rx="30"/>
        <rect x="370" y="398" width="60" height="228" rx="30"/>
        <rect x="482" y="359" width="60" height="306" rx="30"/>
        <rect x="594" y="398" width="60" height="228" rx="30"/>
        <rect x="706" y="452" width="60" height="120" rx="30"/>
        <circle cx="778" cy="330" r="40"/>
      </g>
    </mask>
  </defs>

  <g transform="translate(54 54) scale(0.074) translate(-512 -512)">
    <rect x="162" y="267" width="700" height="490" rx="96" fill="#000000" mask="url(#rcMonoCut)"/>
  </g>
</svg>
