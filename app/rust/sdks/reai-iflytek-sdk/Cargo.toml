[package]
name = "reai-iflytek-sdk"
version = "0.1.0"
edition = "2021"
description = "ReAI-style BLE SDK for 讯飞智能录音笔 A1 (iFlytek Smart Recorder A1)"

[dependencies]
async-trait = "0.1"
btleplug = "0.12"
chrono = "0.4"
futures = "0.3"
log = "0.4"
reai-ext-sdk = { path = "../reai-ext-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
uuid = "1"
