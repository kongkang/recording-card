[package]
name = "reai-getseed-sdk"
version = "0.2.0"
edition = "2021"
description = "ReAI-style BLE SDK wrapper for GetSeed (得到 Get 笔记录音卡 GSC10)"

[dependencies]
aes = "0.8"
async-trait = "0.1"
btleplug = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
futures = "0.3"
reai-ext-sdk = { path = "../reai-ext-sdk" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs"] }
uuid = "1"
