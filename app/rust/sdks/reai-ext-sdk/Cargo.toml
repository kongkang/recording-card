[package]
name = "reai-ext-sdk"
version = "0.1.0"
edition = "2021"
description = "Core ReAI-style SDK traits, unified hardware capability model, and pure-Rust 16kHz audio codecs for third-party BLE recorders"

[dependencies]
async-trait = "0.1"
btleplug = "0.12"
lc3-codec = "0.2"
opus-pure = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs"] }
uuid = "1"
