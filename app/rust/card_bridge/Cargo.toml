[package]
name = "card_bridge"
version = "0.1.0"
edition = "2021"
description = "FFI bridge: expose reai-card-sdk (BLE) to Flutter via a small C ABI"

[lib]
name = "card_bridge"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
reai-card-sdk = { git = "https://github.com/ReAI-com/reai-card-sdk.git", tag = "v0.0.6" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
