[package]
name = "card_bridge"
version = "0.2.0"
edition = "2021"
rust-version = "1.93"
description = "Owned-string serialized FFI bridge for reai-card-sdk recording cards"

[lib]
name = "card_bridge"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
reai-card-sdk = { git = "https://github.com/ReAI-com/reai-card-sdk.git", tag = "v0.0.6" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
btleplug = "=0.12.0"
jni = "0.19"
