# ai-card.app.reai.com — 正式配置（80→443 重定向 + 静态官网 + Universal Links + TestFlight 邀请 API 反代）

server {
    listen 80;
    listen [::]:80;
    server_name ai-card.app.reai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://ai-card.app.reai.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-card.app.reai.com;

    ssl_certificate     /etc/letsencrypt/live/ai-card.app.reai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-card.app.reai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_ai_card:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache" always;

    root /var/www/ai-card.app.reai.com;
    index index.html;

    location /assets/ {
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ^~ /api/beta/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # Apple Universal Links (AASA) — must return HTTP 200 + application/json, never fall back to index.html.
    location ~ ^/(\.well-known/)?apple-app-site-association$ {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300" always;
        return 200 '{"applinks":{"apps":[],"details":[{"appID":"35N5SGDE59.com.reai.recordingcard","paths":["/link/*"]}]}}';
    }

    # Universal Link fallback for Recording Card (handles /link/ and /link/<appId>/... subpaths).
    location ^~ /link/ {
        default_type text/html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        try_files /link/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
