name: Flutter CI

on:
  push:
    branches: [master, "stage/**"]
  pull_request:
    branches: [master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Linux Bluetooth build dependencies for Rust bridge
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust/card_bridge

      - name: Test Rust card_bridge
        working-directory: .
        run: cargo test --manifest-path app/rust/card_bridge/Cargo.toml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare Android Gradle Config
        run: flutter build apk --debug --config-only

      - name: Compile Android Debug Kotlin
        run: |
          if [ -x android/gradlew ]; then
            (cd android && ./gradlew :app:compileDebugKotlin -Prust.skip=true)
          else
            (cd android && gradle :app:compileDebugKotlin -Prust.skip=true)
          fi
