name: Watch Prototype CI

on:
  push:
    branches: [master]
    paths:
      - "watch/prototype/**"
      - ".github/workflows/watch-prototype.yml"
  pull_request:
    branches: [master]
    paths:
      - "watch/prototype/**"
      - ".github/workflows/watch-prototype.yml"

jobs:
  verify-watch-prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify watch HTML prototype
        run: node watch/prototype/verify.mjs
