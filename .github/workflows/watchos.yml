name: WatchOS & Companion CI

on:
  push:
    branches: [master]
    paths:
      - "watch/**"
      - ".github/workflows/watchos.yml"
  pull_request:
    branches: [master]
    paths:
      - "watch/**"
      - ".github/workflows/watchos.yml"

jobs:
  verify-and-archive:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          LATEST_XCODE16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$LATEST_XCODE16" ]; then
            sudo xcode-select -s "$LATEST_XCODE16"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Ensure watchOS SDK is available
        run: |
          if ! xcrun --sdk watchos --show-sdk-path >/dev/null 2>&1; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcrun --sdk watchos --show-sdk-path

      - name: Run WatchRecorderCore tests & verifier
        run: |
          swift test --package-path watch/Packages/WatchRecorderCore
          swift run --package-path watch/Packages/WatchRecorderCore WatchRecorderCoreVerify

      - name: Build RecordingCardWatchApp (watchOS unsigned)
        run: |
          xcodebuild build \
            -project watch/RecordingCardWatch.xcodeproj \
            -scheme RecordingCardWatchApp \
            -configuration Release \
            -destination "generic/platform=watchOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Archive RecordingCardWatchCompanion (iOS + embedded WatchApp + WatchWidgets unsigned)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project watch/RecordingCardWatch.xcodeproj \
            -scheme RecordingCardWatchCompanion \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/RecordingCardWatch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Verify embedded bundle hierarchy & plist invariants
        run: |
          APP="$PWD/build/RecordingCardWatch.xcarchive/Products/Applications/RecordingCardWatchCompanion.app"
          WATCH="$APP/Watch/RecordingCardWatchApp.app"
          WIDGET="$WATCH/PlugIns/RecordingCardWatchWidgets.appex"
          test -d "$APP"
          test -d "$WATCH"
          test -d "$WIDGET"

          COMPANION_ID=$(plutil -extract WKCompanionAppBundleIdentifier raw "$WATCH/Info.plist")
          test "$COMPANION_ID" = "com.reai.recordingcard.watch"

          IOS_BUILD=$(plutil -extract CFBundleVersion raw "$APP/Info.plist")
          WATCH_BUILD=$(plutil -extract CFBundleVersion raw "$WATCH/Info.plist")
          WIDGET_BUILD=$(plutil -extract CFBundleVersion raw "$WIDGET/Info.plist")
          echo "Builds: iOS=$IOS_BUILD watchOS=$WATCH_BUILD widget=$WIDGET_BUILD"
          test "$IOS_BUILD" = "$WATCH_BUILD"
          test "$IOS_BUILD" = "$WIDGET_BUILD"

      - name: Upload unsigned archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: recording-card-watch-xcarchive
          path: build/RecordingCardWatch.xcarchive
          retention-days: 7
