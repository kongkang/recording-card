    }
    #stage-wrap {

    .board-canvas {

      width: 1440px;
      flex-shrink: 0;

      overflow: hidden;
    }
    .single-stage {

      align-items: flex-start;

    }
    .single-sidebar {
      width: 300px;

      padding: 20px;

      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    }
    .single-jump {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    .single-jump-btn {
      text-align: left;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #262A34;
      background: #1A1D25;
      color: #F3F4F6;

      font-weight: 600;

    }
    .single-jump-btn.is-active {
      background: #F5A623;
      color: #111214;
      border-color: #F5A623;
    }
    .scroll-area {

      overflow-x: hidden;

    }
    .scroll-area::-webkit-scrollbar { display: none; }
    button { font-family: inherit; } [data-act] { scroll-margin-top: 72px; }
    .watch-stage-outer {
      max-width: 1120px;
      margin: 28px auto 72px;
      padding: 28px 28px 34px;
      border-radius: 24px;
      background: rgba(18, 20, 26, 0.94);

    .watch-stage-head {

      margin: 0;

    .watch-ctl-btn {

    .watch-ctl-btn.is-on {

    /* Shared 6-Style Apple Watch Series 10 (46mm) Showcase Styles */
.rcw-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  width: 100%;
}

.rcw-trio {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 36px;
  flex-wrap: wrap;
  width: 100%;
  padding: 12px 0 6px;
}

.rcw-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.rcw-slot-label {
  font-size: 13px;
  font-weight: 600;
  color: #4B5563;
  letter-spacing: -0.01em;
}

.gallery-bar-dark ~ #watch-stage-wrap .rcw-slot-label,
.rcw-on-dark .rcw-slot-label {
  color: rgba(244, 244, 246, 0.72);
}

/* Watch physical hardware assembly */
.rcw-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
}

.rcw-band-top,
.rcw-band-bot {
  width: 138px;
  height: 30px;
  background: linear-gradient(180deg, #2D2D31, #1A1A1D);
  border-radius: 14px 14px 4px 4px;
  box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.08);
}

.rcw-band-bot {
  border-radius: 4px 4px 14px 14px;
}

.rcw-case-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.watch-case.rcw-case {
  width: 252px;
  height: 304px;
  border-radius: 54px;
  padding: 13px;
  background: linear-gradient(148deg, #343438, #141416);
  box-shadow: 0 22px 44px rgba(17, 19, 24, 0.24), inset 0 0 0 1.5px rgba(255, 255, 255, 0.14);
  position: relative;
  transition: transform 0.12s cubic-bezier(0.2, 0.9, 0.3, 1);
}

.watch-case.rcw-case.knock-hit {
  transform: translateY(-2px) scale(0.985);
}

/* Case finish per direction */
.rcw-theme-dir1 .watch-case.rcw-case {
  background: linear-gradient(148deg, #474640, #23231F);
}
.rcw-theme-dir1 .rcw-band-top,
.rcw-theme-dir1 .rcw-band-bot {
  background: linear-gradient(180deg, #3D3C36, #242420);
}
.rcw-theme-dir2 .watch-case.rcw-case {
  background: linear-gradient(148deg, #525763, #232730);
}
.rcw-theme-dir3 .watch-case.rcw-case {
  background: linear-gradient(148deg, #453C34, #1E1915);
}
.rcw-theme-dir3 .rcw-band-top,
.rcw-theme-dir3 .rcw-band-bot {
  background: linear-gradient(180deg, #383029, #1E1A16);
}
.rcw-theme-dir4 .watch-case.rcw-case {
  background: linear-gradient(148deg, #25272C, #0D0E10);
}
.rcw-theme-dir5 .watch-case.rcw-case {
  background: linear-gradient(148deg, #595F6A, #2A2F38);
}

.rcw-crown {
  position: absolute;
  right: -10px;
  top: 74px;
  width: 11px;
  height: 44px;
  border-radius: 5px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: linear-gradient(180deg, #62626A, #2B2B30);
  box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.22);
  cursor: pointer;
  padding: 0;
}

.rcw-sidebtn {
  position: absolute;
  right: -6px;
  top: 148px;
  width: 7px;
  height: 58px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: linear-gradient(180deg, #4A4A50, #232327);
  cursor: pointer;
  padding: 0;
}

.rcw-screen {
  width: 100%;
  height: 100%;
  border-radius: 42px;
  overflow: hidden;
  background: #060607;
  color: #F6F4EF;
  padding: 12px 12px 11px;
  display: flex;
  flex-direction: column;
  position: relative;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  transition: opacity 0.2s, filter 0.2s;
}

.rcw-screen.is-aod {
  opacity: 0.72;
  filter: brightness(0.68);
}

/* Theme screen foundations */
.rcw-theme-dir1 .rcw-screen {
  background: #0D0E0C;
  background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
  background-size: 10px 10px;
  color: #F4F3EE;
}
.rcw-theme-dir2 .rcw-screen {
  background: #080A0F;
  color: #F5F7FA;
}
.rcw-theme-dir3 .rcw-screen {
  background: #0E0C0A;
  color: #F4EDE0;
}
.rcw-theme-dir4 .rcw-screen {
  background: #000000;
  color: #F3F4F6;
}
.rcw-theme-dir5 .rcw-screen {
  background: #080A0D;
  color: #F4F6F9;
}

/* Dir 5 Liquid Glass subtle top ambient status glow */
.rcw-ambient-glow {
  display: none;
  position: absolute;
  left: -10px;
  right: -10px;
  top: -12px;
  height: 104px;
  pointer-events: none;
  z-index: 0;
}
.rcw-theme-dir5 .rcw-ambient-glow {
  display: block;
  background: radial-gradient(ellipse at 50% 0%, rgba(56, 145, 125, 0.34) 0%, transparent 74%);
}
.rcw-theme-dir5 .rcw-screen.is-rec .rcw-ambient-glow {
  background: radial-gradient(ellipse at 50% 0%, rgba(232, 92, 66, 0.38) 0%, transparent 74%);
}

/* Dir 2 Chronos left vertical time rail */
.rcw-chrono-rail {
  display: none;
  position: absolute;
  left: 8px;
  top: 42px;
  bottom: 48px;
  width: 3px;
  border-radius: 99px;
  background: repeating-linear-gradient(
    to bottom,
    rgba(59, 130, 246, 0.45) 0 2px,
    transparent 2px 9px
  );
  pointer-events: none;
  z-index: 1;
}
.rcw-theme-dir2 .rcw-screen.is-app-view .rcw-chrono-rail {
  display: block;
}

.rcw-knock-ripple {
  position: absolute;
  inset: 16px;
  border-radius: 28px;
  border: 2px solid #F2A23C;
  pointer-events: none;
  opacity: 0;
  z-index: 20;
}
.rcw-theme-dir1 .rcw-knock-ripple { border-color: #FF5514; border-radius: 16px; }
.rcw-theme-dir2 .rcw-knock-ripple { border-color: #EF4444; }
.rcw-theme-dir3 .rcw-knock-ripple { border-color: #C83E2B; }
.rcw-theme-dir4 .rcw-knock-ripple { border-color: #F5A623; }
.rcw-theme-dir5 .rcw-knock-ripple { border-color: #E85C42; }

@keyframes rcwKnockRipple {
  0% { opacity: 0.9; transform: scale(0.76); }
  100% { opacity: 0; transform: scale(1.03); }
}
.rcw-knock-ripple.active {
  animation: rcwKnockRipple 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes rcwPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
@keyframes rcwWave {
  0%, 100% { transform: scaleY(0.5); opacity: 0.65; }
  50% { transform: scaleY(1); opacity: 1; }
}

/* Status top bar (NO app title) */
.rcw-top {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  height: 18px;
  padding: 0 4px;
  flex: none;
  color: rgba(255, 255, 255, 0.72);
}

.rcw-conn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.88);
  white-space: nowrap;
}

.rcw-conn-dot {
  width: 6.5px;
  height: 6.5px;
  border-radius: 50%;
  background: #2DC653;
  flex: none;
}
.rcw-conn.is-off .rcw-conn-dot { background: #F59E0B; }
.rcw-theme-dir1 .rcw-conn .rcw-conn-dot { background: #A3B86C; border-radius: 1px; }
.rcw-theme-dir1 .rcw-conn.is-off .rcw-conn-dot { background: #FF5514; }
.rcw-theme-dir2 .rcw-conn .rcw-conn-dot { background: #3B82F6; }

.rcw-top-right {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.rcw-batt {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.72);
}
.rcw-batt svg { color: #2DC653; }
.rcw-theme-dir1 .rcw-batt svg { color: #A3B86C; }
.rcw-theme-dir4 .rcw-batt svg { color: #F5A623; }
.rcw-batt.lv-mid svg { color: #F59E0B; }
.rcw-batt.lv-low svg { color: #EF4444; }

.rcw-clock {
  font-size: 11px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.92);
}

/* Main Watch App view */
.rcw-app {
  position: relative;
  z-index: 2;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.rcw-hero {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2px 4px;
  cursor: pointer;
}

.rcw-date {
  font-size: 10.5px;
  font-weight: 600;
  color: #F2A23C;
  letter-spacing: 0.02em;
}
.rcw-theme-dir1 .rcw-date { font-family: "Space Mono", ui-monospace, monospace; color: #FF5514; letter-spacing: 0.04em; }
.rcw-theme-dir2 .rcw-date { color: #60A5FA; }
.rcw-theme-dir3 .rcw-date { font-family: "Noto Serif SC", Georgia, serif; color: #D96552; }
.rcw-theme-dir4 .rcw-date { color: #F5A623; }
.rcw-theme-dir5 .rcw-date { color: #6CD4B9; }

.rcw-bigclock {
  font-size: 42px;
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -1.4px;
  font-variant-numeric: tabular-nums;
  margin-top: 3px;
}
.rcw-theme-dir1 .rcw-bigclock { font-family: "Space Mono", ui-monospace, monospace; font-size: 36px; letter-spacing: -1px; }
.rcw-theme-dir2 .rcw-bigclock { font-family: "Instrument Serif", Georgia, serif; font-size: 46px; letter-spacing: -0.5px; }
.rcw-theme-dir3 .rcw-bigclock { font-family: "Noto Serif SC", Georgia, serif; font-size: 40px; }
.rcw-theme-dir4 .rcw-bigclock { font-family: "Space Grotesk", -apple-system, sans-serif; }
.rcw-theme-dir5 .rcw-bigclock { font-family: "Plus Jakarta Sans", -apple-system, sans-serif; }

.rcw-idle-hint {
  font-size: 9.5px;
  color: rgba(255, 255, 255, 0.44);
  margin-top: 6px;
}

.rcw-recline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.8);
}

.rcw-rec-dot {
  width: 6.5px;
  height: 6.5px;
  border-radius: 50%;
  background: #E85035;
  animation: rcwPulse 1s infinite;
}
.rcw-theme-dir1 .rcw-rec-dot { background: #FF5514; border-radius: 1px; }
.rcw-theme-dir2 .rcw-rec-dot { background: #EF4444; }
.rcw-theme-dir3 .rcw-rec-dot { background: #C83E2B; }
.rcw-theme-dir4 .rcw-rec-dot { background: #F5A623; }
.rcw-theme-dir5 .rcw-rec-dot { background: #E85C42; }

.rcw-mark-pill {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(242, 162, 60, 0.2);
  color: #F2A23C;
  font-size: 9.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.rcw-theme-dir1 .rcw-mark-pill { background: #FF5514; color: #FFFFFF; border-radius: 3px; font-family: "Space Mono", monospace; }
.rcw-theme-dir2 .rcw-mark-pill { background: rgba(239, 68, 68, 0.22); color: #F87171; }
.rcw-theme-dir3 .rcw-mark-pill { background: #A62B21; color: #F7F2E8; border-radius: 3px; font-family: "Noto Serif SC", serif; }
.rcw-theme-dir4 .rcw-mark-pill { background: rgba(245, 166, 35, 0.22); color: #F5A623; }
.rcw-theme-dir5 .rcw-mark-pill { background: rgba(232, 92, 66, 0.22); color: #FFA28F; }

.rcw-timer {
  font-size: 32px;
  font-weight: 600;
  line-height: 1.06;
  letter-spacing: -0.8px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-variant-numeric: tabular-nums;
  margin-top: 3px;
}
.rcw-theme-dir1 .rcw-timer { font-family: "Space Mono", ui-monospace, monospace; font-size: 30px; letter-spacing: -0.5px; }
.rcw-theme-dir2 .rcw-timer { font-family: "Space Grotesk", ui-monospace, sans-serif; }
.rcw-theme-dir3 .rcw-timer { font-family: "Noto Serif SC", Georgia, serif; letter-spacing: 0; }
.rcw-theme-dir4 .rcw-timer { font-family: "Space Grotesk", ui-monospace, sans-serif; color: #FFFFFF; }
.rcw-theme-dir5 .rcw-timer { font-family: "Plus Jakarta Sans", -apple-system, sans-serif; }

/* Dir 4 Nocturne signature spectrum bar */
.rcw-spectrum {
  display: none;
  align-items: flex-end;
  justify-content: center;
  gap: 2.5px;
  height: 16px;
  margin-top: 5px;
}
.rcw-theme-dir4 .rcw-spectrum {
  display: inline-flex;
}
.rcw-spectrum i {
  display: block;
  width: 2.5px;
  border-radius: 2px;
  background: rgba(245, 166, 35, 0.78);
  animation: rcwWave 1.1s ease-in-out infinite;
}
.rcw-spectrum i.dim {
  background: rgba(255, 255, 255, 0.2);
}

.rcw-remain {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.6);
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
}

.rcw-knock-hint {
  font-size: 9.5px;
  color: rgba(255, 255, 255, 0.42);
  margin-top: 4px;
}

/* Bottom controls */
.rcw-bottom {
  flex: none;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.rcw-rec-btn {
  width: 100%;
  height: 34px;
  border: 0;
  border-radius: 999px;
  background: #2DC653;
  color: #FFFFFF;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}
.rcw-theme-dir1 .rcw-rec-btn { background: #FF5514; border-radius: 8px; font-family: "Space Mono", sans-serif; }
.rcw-theme-dir2 .rcw-rec-btn { background: #1D4ED8; }
.rcw-theme-dir3 .rcw-rec-btn { background: #A62B21; border-radius: 10px; font-family: "Noto Serif SC", serif; }
.rcw-theme-dir4 .rcw-rec-btn { background: #F5A623; color: #111318; font-weight: 700; }
.rcw-theme-dir5 .rcw-rec-btn { background: #115E63; color: #FFFFFF; }

/* Flat matte slide-to-stop (zero metallic bevels) */
.rcw-stop {
  position: relative;
  height: 34px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(232, 80, 53, 0.16);
  border: 1px solid rgba(232, 80, 53, 0.38);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #F28B79;
  font-size: 10.5px;
  font-weight: 600;
  padding-left: 16px;
  touch-action: none;

    if (spk.name) return includeSuffix ? `${spk.name}（推测）` : spk.name;
    return includeSuffix ? `${spk.baseLabel}（推测）` : spk.baseLabel;
  }

  function eventPhotoCount(ev) {
    return (ev.photos || []).filter(p => !p.excluded).length;

  function activeUnclassified(state) {
    return state.unclassifiedPhotos.filter(p => !p.dismissed);

  function buildMergedFullText(state, summary) {
    const srcEvents = state.events.filter(e => summary.srcIds.includes(e.id));
    const blocks = [];
    srcEvents.forEach(ev => {
      let cur = null;
      ev.dlg.forEach(turn => {
        const name = speakerDisplay(state, turn.spkId, true);
        if (cur && cur.spkId === turn.spkId) {
          cur.lines.push(turn.text);
        } else {
          cur = { spkId: turn.spkId, name, time: turn.time, lines: [turn.text] };
          blocks.push(cur);
        }
      });
    });
    return blocks;
  }

  function generateSummaryFromSelection(state, selectedIds) {
    const chosen = state.events.filter(e => selectedIds.includes(e.id));
    if (!chosen.length) return null;
    if (chosen.length === 1 && chosen[0].id === 'e2') return state.summaries[0];
    const id = 'sum-' + Date.now().toString(36);
    const title = chosen.length === 1 ? chosen[0].title : `今日核心总结（${chosen.length} 段）`;
    const todos = [];
    if (selectedIds.includes('e1')) {
      todos.push({ id: 'gt1', text: '周五前发出分工文档与书面结论', due: '本周五', done: false });
      todos.push({ id: 'gt2', text: '导出功能延后两周，先交小方案', due: '本迭代', done: false });
    }
    if (selectedIds.includes('e2')) {
      todos.push({ id: 'gt3', text: '优化列表加载速度并记住筛选条件', due: '下版本', done: false });
    }
    if (selectedIds.includes('e3')) {
      todos.push({ id: 'gt4', text: '明早确认测试环境是否就绪', due: '明早', done: false });
    }
    if (!todos.length) {
      todos.push({ id: 'gt5', text: '晚 20:00 灰度放量盯守前半小时', due: '今晚', done: false });
    }
    const firstPhoto = chosen.map(e => (e.photos || []).find(p => !p.excluded)).find(Boolean);
    const sum = {
      id,
      title,
      timeLabel: `${chosen[chosen.length - 1].dayLabel}  ${chosen.length} 段录音`,
      srcIds: chosen.map(e => e.id),
      conclusion: chosen.map(e => e.takeaway).join('；') + '。',
      keyImg: firstPhoto ? firstPhoto.img : '',
      keyImgCap: firstPhoto ? firstPhoto.caption : '',
      todos
    };
    state.summaries.unshift(sum);
    chosen.forEach(e => { e.refSummaryId = id; });
    return sum;
  }

    const q = query || '';

  }

  function applySpeakerRename(state, spkId, newName, rememberVp) {
    const clean = (newName || '').trim();
    if (!clean) return;
    const target = state.speakers[spkId];
    if (!target) return;
    target.name = clean;
    target.confirmed = true;
    if (rememberVp) {
      const empty = state.voiceprints.slots.find(s => !s.locked && !s.name);
      const exists = state.voiceprints.slots.find(s => s.name === clean);
      if (!exists && empty) empty.name = clean;
    }
    if (!state.voiceprints.recent.includes(clean)) {
      state.voiceprints.recent.unshift(clean);
      state.voiceprints.recent = state.voiceprints.recent.slice(0, 4);
    }
  }

  function triggerManualSync(state, onUpdate) {
    if (state.hw.syncStatus === 'syncing' || state.hw.syncCooldown) return;
    state.hw.syncStatus = 'syncing';
    state.hw.syncLabel = '正在同步…';
    onUpdate();
    setTimeout(() => {
      state.hw.syncStatus = 'done';
      state.hw.syncLabel = '刚刚已同步';
      state.hw.syncCooldown = true;
      onUpdate();
      setTimeout(() => {
        state.hw.syncCooldown = false;
        state.hw.syncStatus = 'idle';
        state.hw.syncLabel = '刚刚已同步';
        onUpdate();
      }, 3000);
    }, 600);
  }

  function fmtWatchHms(sec) {
    var s = Math.max(0, sec | 0);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var r = s % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }

  function fmtMinSec(sec) {
    var s = Math.max(0, sec | 0);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + String(r).padStart(2, '0');
  }

  function bindWatchInteractions(rootEl, getState, onChange) {
    if (!rootEl || rootEl.__rcwBound) return;
    rootEl.__rcwBound = true;

    // Support pointer swipe on slide-to-stop knob
    rootEl.addEventListener('pointerdown', function (ev) {
      var knob = ev.target.closest('[data-wact="stop-slide"]');
      if (!knob) return;
      var track = knob.closest('.rcw-stop');
      if (!track) return;
      ev.preventDefault();
      var trackRect = track.getBoundingClientRect();
      var maxDrag = Math.max(10, trackRect.width - knob.offsetWidth - 6);
      var startX = ev.clientX;
      var moved = 0;

      function onMove(mv) {
        moved = Math.max(0, Math.min(maxDrag, mv.clientX - startX));
        knob.style.transform = 'translateX(' + moved + 'px)';
      }

      function onUp() {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        if (moved >= maxDrag * 0.8) {
          stopRecSlice(getState(), onChange);
        } else {
          knob.style.transform = 'translateX(0px)';
        }
      }

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });

    rootEl.addEventListener('dblclick', function (ev) {
      var hero = ev.target.closest('[data-wact="hero-knock"]');
      if (!hero) return;
      var st = getState();
      if (!st.isRec) return;
      st.marks += 1;
      st.knockFlash = true;
      onChange();
      setTimeout(function () {
        st.knockFlash = false;
        onChange();
      }, 480);
    });

    rootEl.addEventListener('click', function (ev) {
      var actEl = ev.target.closest('[data-wact]');
      if (!actEl) return;
      var act = actEl.dataset.wact;
      var st = getState();
      if (act === 'start-rec') {
        st.isRec = true;
        st.queueOpen = false;
        st.aod = false;
        onChange();
      } else if (act === 'comp-toggle') {
        if (st.isRec) {
          stopRecSlice(st, onChange);
        } else {
          st.isRec = true;
          st.queueOpen = false;
          onChange();
        }
      } else if (act === 'open-queue') {
        st.queueOpen = true;
        onChange();
      } else if (act === 'close-queue') {
        st.queueOpen = false;
        onChange();
      } else if (act === 'flush-queue') {
        st.slices.forEach(function (sl) { sl.status = 'synced'; sl.label = '已同步'; });
        onChange();
      } else if (act === 'wake-screen') {
        if (st.aod) {
          st.aod = false;
          onChange();
        }
      } else if (act === 'stop-slide' && ev.detail === 0) {
        // Keyboard / direct click fallback for automated testing
        stopRecSlice(st, onChange);
      }
    });
  }

  function stopRecSlice(st, onChange) {
    if (!st.isRec) return;
    st.isRec = false;
    var lap = (st.elapsedSec % 60) || 42;
    st.slices.unshift({
      id: 's-' + Date.now(),
      title: '片段 #' + (11 + st.slices.length),
      dur: lap + 's',
      status: 'pending',
      label: '待传'
    });
    onChange();
  }

  function triggerWatchKnock(st, onChange) {
    if (!st.isRec) st.isRec = true;
    st.marks += 1;
    st.knockFlash = true;
    onChange();
    setTimeout(function () {
      st.knockFlash = false;
      onChange();
    }, 480);
  }

  function cutWatchSlice(st, onChange) {
    var nextSec = st.elapsedSec + 60;
    st.elapsedSec = nextSec;
    st.slices.unshift({
      id: 's-' + Date.now(),
      title: '片段 #' + (11 + st.slices.length),
      dur: '60s',
      status: st.phoneConnected ? 'synced' : 'pending',
      label: st.phoneConnected ? '已同步' : '待传'
    });
    onChange();
  }

  global.RCWatchEngine = {
    THEMES: WATCH_THEMES,
    createState: createDefaultWatchState,
    renderCase: renderWatchCase,
    renderShowcaseHtml: renderWatchShowcaseHtml,
    bind: bindWatchInteractions,
    stopRecSlice: stopRecSlice,
    triggerKnock: triggerWatchKnock,
    cutSlice: cutWatchSlice
  };
})(window);

  </script>
  <script>
    
(function () {
  const {
    ASSETS, svgIcon, formatHms, esc, buildInitialData,
    speakerDisplay, activeUnclassified, buildMergedFullText,
    generateSummaryFromSelection, generateOs1Reply, applySpeakerRename,
    triggerManualSync, renderIosShell
  } = window.RC_ENGINE;

  const PHONE_SPECS = [
    { id: 'p1', label: '暗房声录流', init: { screen: 'home', detailId: 'e1', detailTab: 'dlg', sumId: 'sum-demo', sumTab: 'conclusion' } },
    { id: 'p2', label: '对话与声谱', init: { screen: 'detail', detailId: 'e1', detailTab: 'dlg', sumId: 'sum-demo', sumTab: 'conclusion' } },
    { id: 'p3', label: '总结结论', init: { screen: 'summary', detailId: 'e2', detailTab: 'dlg', sumId: 'sum-demo', sumTab: 'conclusion' } },
    { id: 'p4', label: 'OS1 声环', init: { screen: 'os1', detailId: 'e1', detailTab: 'dlg', sumId: 'sum-demo', sumTab: 'conclusion' } },
    { id: 'p5', label: '设备与设置', init: { screen: 'settings', detailId: 'e1', detailTab: 'dlg', sumId: 'sum-demo', sumTab: 'conclusion' } }

  const phones = {};
  PHONE_SPECS.forEach(spec => {
    phones[spec.id] = {
      id: spec.id,
      data: buildInitialData(),
      ui: {
        screen: spec.init.screen,
        detailId: spec.init.detailId,
        detailTab: spec.init.detailTab,
        sumId: spec.init.sumId,
        sumTab: spec.init.sumTab,
        selectMode: false,
        selectedIds: ['e1', 'e2'],
        scrubHotIdx: 5,
        modal: null,
        renameSpkId: 's1',
        renameDraft: '',
        renameRemember: true,
        rawPlaying: false,
        chatInput: '',
        toast: ''
      }
    };
  });

  let viewMode = new URLSearchParams(location.search).get('mode') === 'single' ? 'single' : 'board';
  let activeSingleId = 'p1';

  function showToast(p, msg) {
    p.ui.toast = msg;
    renderAll();
    setTimeout(() => { if (p.ui.toast === msg) { p.ui.toast = ''; renderAll(); } }, 2200);
  }

  function renderTopBar(p) {
    const hw = p.data.hw;
    const dev = p.data.devices.find(d => d.id === hw.connectedId);
    const dotCol = hw.recording ? '#EF4444' : (hw.connectedId ? '#22C55E' : '#6B7280');
    const txt = hw.connectedId ? (hw.recording ? '录音中' : dev.model) : '连接设备';
    return `
      <div class="ns-topbar">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="display:inline-flex;width:21px;height:21px;border-radius:5px;overflow:hidden;">${ASSETS.appIconSvg || ''}</span>
          <span style="font-size:16px;font-weight:800;">录音卡</span>
        </div>
        <button type="button" class="ns-cap" data-act="open-hw" data-pid="${p.id}">
          <span style="width:7px;height:7px;border-radius:50%;background:${dotCol};"></span>
          <span>${esc(txt)}</span>
          ${hw.recording ? `<span data-live-clock="${p.id}" style="font-variant-numeric:tabular-nums;">${formatHms(hw.sec)}</span>` : ''}
        </button>
      </div>
    `;
  }

  function renderThumbDock(p) {
    const scr = p.ui.screen;
    const tabs = [
      { id: 'home', icon: 'wave', label: '声录' },
      { id: 'summary', icon: 'doc', label: '总结' },
      { id: 'os1', icon: 'spark', label: '问答' },
      { id: 'settings', icon: 'sliders', label: '设置' }
    ];
    return `
      <div class="ns-thumb-dock">
        ${tabs.map(t => `
          <button type="button" class="ns-dock-pill ${scr === t.id ? 'is-active' : ''}" data-act="nav" data-screen="${t.id}" data-pid="${p.id}">
            ${svgIcon(t.icon, 15, 1.9)} <span>${t.label}</span>
          </button>
        `).join('')}
      </div>
    `;
  }

  function renderHome(p) {
    const st = p.data;
    const hw = st.hw;
    const unc = activeUnclassified(st);
    const today = st.events.filter(e => e.dayOff === 0);
    const yest = st.events.filter(e => e.dayOff === 1);
    const sum = st.summaries[0];

    const renderRow = (ev) => {
      const pic = (ev.photos || []).find(ph => !ph.excluded);
      const sel = p.ui.selectedIds.includes(ev.id);
      const bars = (ev.energyBars || [40,60,80,50,70]).map((val, idx) => {
        const isPeak = ev.markTime && idx === 4;
        return `<div class="ns-spec-bar ${isPeak ? 'is-peak' : ''}" style="height:${Math.max(25, val)}%;"></div>`;
      }).join('');
      return `
        <div class="ns-row ${p.ui.selectMode && sel ? 'is-sel' : ''}" data-act="${p.ui.selectMode ? 'toggle-sel' : 'open-detail'}" data-eid="${ev.id}" data-pid="${p.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
              ${p.ui.selectMode ? `<span class="ns-chk ${sel ? 'is-done' : ''}">${sel ? svgIcon('check', 12, 2.4) : ''}</span>` : ''}
              <div style="min-width:0;">
                <div style="font-size:15px;font-weight:700;color:#FFFFFF;">${esc(ev.title)}</div>
                <div style="margin-top:4px;font-size:12px;color:var(--ns-muted);display:flex;gap:10px;">
                  <span>${esc(ev.time)}</span>
                  <span>${esc(ev.durText)}</span>
                  ${ev.markTime ? `<span style="color:var(--ns-amber-hi);font-weight:700;">${esc(ev.markTime)} 重点</span>` : ''}
                </div>
              </div>
            </div>
            ${pic ? `<img src="${ASSETS[pic.img] || ''}" alt="${esc(pic.caption)}" style="width:42px;height:42px;border-radius:7px;object-fit:cover;flex-shrink:0;">` : ''}
          </div>
          <div class="ns-spectrum">${bars}</div>
        </div>
      `;
    };

    return `
      ${renderTopBar(p)}
      <div style="padding:10px 18px 14px;border-bottom:1px solid var(--ns-line);display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div data-live-clock="${p.id}" style="font-size:28px;font-weight:800;line-height:1.1;color:${hw.recording ? 'var(--ns-amber-hi)' : '#FFFFFF'};font-variant-numeric:tabular-nums;">
            ${hw.recording ? formatHms(hw.sec) : '待机中'}
          </div>
          <div style="font-size:12px;color:var(--ns-muted);margin-top:4px;">${esc(hw.batteryText)}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button type="button" class="ns-ghost-btn" data-act="toggle-selmode" data-pid="${p.id}">${p.ui.selectMode ? '取消' : '多选'}</button>
          <button type="button" class="ns-amber-btn" data-act="toggle-rec" data-pid="${p.id}">${hw.recording ? '停录' : '开录'}</button>
        </div>
      </div>

      <div class="scroll-area" style="padding-bottom:98px;">
        ${p.ui.selectMode ? `
          <div style="margin:12px 18px 4px;padding:10px 14px;border-radius:10px;background:var(--ns-panel);display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:13px;font-weight:700;">已选 ${p.ui.selectedIds.length} 段</span>
            <button type="button" class="ns-amber-btn" data-act="run-summary" data-pid="${p.id}">生成总结</button>
          </div>
        ` : ''}

        ${unc.length ? `
          <div style="padding:10px 18px;border-bottom:1px solid var(--ns-line);display:flex;justify-content:space-between;align-items:center;cursor:pointer;" data-act="open-unc" data-pid="${p.id}">
            <span style="font-size:13px;color:var(--ns-amber-hi);font-weight:600;">${unc.length} 张照片待归类</span>
            <span style="font-size:12px;color:var(--ns-muted);">去归位</span>
          </div>
        ` : ''}

        ${sum && !p.ui.selectMode ? `
          <div class="ns-row" style="display:flex;justify-content:space-between;align-items:center;" data-act="open-summary" data-sid="${sum.id}" data-pid="${p.id}">
            <div>
              <div style="font-size:15px;font-weight:700;color:#FFFFFF;">${esc(sum.title)}</div>
              <div style="font-size:12px;color:var(--ns-amber-hi);font-weight:700;margin-top:4px;">总结  ${sum.todos.filter(t => !t.done).length} 项待办</div>
            </div>
            <span style="color:var(--ns-muted);">${svgIcon('chev', 16, 2)}</span>
          </div>
        ` : ''}

        <div style="padding:14px 18px 4px;font-size:12px;font-weight:700;color:var(--ns-muted);">今天</div>
        ${today.map(renderRow).join('')}

        <div style="padding:18px 18px 4px;font-size:12px;font-weight:700;color:var(--ns-muted);">昨天</div>
        ${yest.map(renderRow).join('')}
      </div>
      ${renderThumbDock(p)}
    `;
  }

  function renderDetail(p) {
    const st = p.data;
    const ev = st.events.find(e => e.id === p.ui.detailId) || st.events[0];
    const tab = p.ui.detailTab;
    const refSum = st.summaries.find(s => s.srcIds.includes(ev.id));
    const photos = (ev.photos || []).filter(ph => !ph.excluded);
    const bars = ev.energyBars || [40,65,85,55,95,70,45,80];

    let body = '';
    if (tab === 'dlg') {
      body = ev.dlg.map((t, idx) => {
        const spk = st.speakers[t.spkId];
        const photoAfter = photos.filter(ph => ph.afterTurn === idx);
        return `
          <div style="padding:14px 18px;border-bottom:1px solid var(--ns-line);${t.mark ? 'background:rgba(245,166,35,0.08);' : ''}">

              <button type="button" style="border:1px solid ${spk?.confirmed ? 'var(--ns-amber)' : 'var(--ns-line)'};background:${spk?.confirmed ? 'var(--ns-amber)' : 'var(--ns-panel)'};color:${spk?.confirmed ? '#111214' : '#FFFFFF'};border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;" data-act="open-rename" data-spkid="${t.spkId}" data-pid="${p.id}">

              <span style="font-size:12px;color:var(--ns-muted);">${esc(t.mark || t.time)}</span>

            <div style="font-size:14.5px;line-height:1.62;color:#ECEEF2;">${esc(t.text)}</div>

          ${photoAfter.map(ph => `
            <div style="margin:12px 18px;background:var(--ns-panel);border:1px solid var(--ns-line);border-radius:10px;overflow:hidden;">
              <img src="${ASSETS[ph.img] || ''}" alt="${esc(ph.caption)}" style="width:100%;height:142px;object-fit:cover;display:block;">
              <div style="padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ns-muted);">

                <button type="button" class="ns-ghost-btn" data-act="exclude-photo" data-eid="${ev.id}" data-phid="${ph.id}" data-pid="${p.id}">移出</button>

            </div>
          `).join('')}
        `;
      }).join('');
    } else {
      body = `
        <div style="margin:0 18px 14px;padding:12px 14px;background:var(--ns-panel);border-radius:10px;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:14px;font-weight:700;">原声录音 ${esc(ev.durText)}</span>
          <button type="button" class="ns-amber-btn" data-act="toggle-raw-play" data-pid="${p.id}">${p.ui.rawPlaying ? '暂停' : '试听'}</button>
        </div>
        ${ev.raw.map(r => `<div style="padding:12px 18px;border-bottom:1px solid var(--ns-line);"><div style="font-size:12px;color:var(--ns-muted);margin-bottom:4px;"><strong style="color:#FFFFFF;">${esc(speakerDisplay(st, r.spkId, true))}</strong>  ${esc(r.time)}</div><div style="font-size:14px;line-height:1.6;">${esc(r.text)}</div></div>`).join('')}

    return `
      ${renderTopBar(p)}
      <div style="padding:4px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
        <button type="button" style="border:0;background:transparent;color:var(--ns-amber-hi);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:0;" data-act="nav" data-screen="home" data-pid="${p.id}">${svgIcon('back', 16, 2)} 返回</button>
        ${refSum ? `<button type="button" class="ns-ghost-btn" data-act="open-summary" data-sid="${refSum.id}" data-pid="${p.id}">看总结</button>` : ''}
      </div>
      <div style="padding:6px 18px 8px;">
        <h2 style="margin:0;font-size:20px;font-weight:800;">${esc(ev.title)}</h2>
        <div style="display:flex;align-items:flex-end;gap:4px;height:22px;margin-top:10px;">
          ${bars.map((val, i) => `<div style="flex:1;height:${Math.max(25, val)}%;border-radius:2px;background:${i === p.ui.scrubHotIdx ? 'var(--ns-amber)' : '#323846'};cursor:pointer;" data-act="scrub-seg" data-idx="${i}" data-pid="${p.id}"></div>`).join('')}
        </div>
      </div>
      <div class="ns-tab-row">
        <button type="button" class="ns-tab-pill ${tab === 'dlg' ? 'is-active' : ''}" data-act="det-tab" data-tab="dlg" data-pid="${p.id}">对话</button>

  function renderSummary(p) {
    const st = p.data;
    const sum = st.summaries.find(s => s.id === p.ui.sumId) || st.summaries[0];
    const tab = p.ui.sumTab;
    const merged = buildMergedFullText(st, sum);

    let body = '';
    if (tab === 'conclusion') {
      body = `
        <div style="padding:14px 18px;border-bottom:1px solid var(--ns-line);font-size:14.5px;line-height:1.68;">${esc(sum.conclusion)}</div>
        ${sum.keyImg ? `<div style="margin:14px 18px;background:var(--ns-panel);border:1px solid var(--ns-line);border-radius:10px;overflow:hidden;"><img src="${ASSETS[sum.keyImg] || ''}" alt="${esc(sum.keyImgCap)}" style="width:100%;height:140px;object-fit:cover;display:block;"><div style="padding:8px 12px;font-size:12px;color:var(--ns-muted);">${esc(sum.keyImgCap)}</div></div>` : ''}

          <div style="font-size:13px;font-weight:800;color:var(--ns-amber-hi);margin-bottom:8px;">待办（${sum.todos.filter(t => t.done).length}/${sum.todos.length}）</div>
          ${sum.todos.map(td => `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;" data-act="toggle-todo" data-tid="${td.id}" data-pid="${p.id}"><span class="ns-chk ${td.done ? 'is-done' : ''}">${td.done ? svgIcon('check', 12, 2.4) : ''}</span><span style="flex:1;font-size:14px;${td.done ? 'text-decoration:line-through;color:var(--ns-muted);' : 'color:#FFFFFF;'}">${esc(td.text)}</span><span style="font-size:12px;color:var(--ns-muted);">${esc(td.due)}</span></div>`).join('')}
        </div>
      `;
    } else if (tab === 'full') {
      body = merged.map(b => `<div style="padding:14px 18px;border-bottom:1px solid var(--ns-line);"><button type="button" class="ns-ghost-btn" style="margin-bottom:7px;" data-act="open-rename" data-spkid="${b.spkId}" data-pid="${p.id}">${esc(b.name)}</button><div style="font-size:14.5px;line-height:1.68;">${esc(b.lines.join(' '))}</div></div>`).join('');
    } else {
      body = srcs.map(ev => `<div class="ns-row" style="display:flex;justify-content:space-between;align-items:center;" data-act="open-detail" data-eid="${ev.id}" data-pid="${p.id}"><div><div style="font-size:15px;font-weight:700;">${esc(ev.title)}</div><div style="font-size:12px;color:var(--ns-muted);margin-top:3px;">${esc(ev.dayLabel)} ${esc(ev.time)}  ${esc(ev.durText)}</div></div><span>${svgIcon('chev', 16, 2)}</span></div>`).join('');

    return `
      ${renderTopBar(p)}
      <div style="padding:4px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
        <button type="button" style="border:0;background:transparent;color:var(--ns-amber-hi);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:0;" data-act="nav" data-screen="home" data-pid="${p.id}">${svgIcon('back', 16, 2)} 返回</button>
        <button type="button" class="ns-amber-btn" data-act="open-export" data-pid="${p.id}">导出</button>
      </div>
      <div style="padding:6px 18px 8px;">
        <h2 style="margin:0;font-size:20px;font-weight:800;">${esc(sum.title)}</h2>
        <div style="font-size:13px;color:var(--ns-muted);margin-top:4px;">${esc(sum.timeLabel)}</div>
      </div>
      <div class="ns-tab-row">
        <button type="button" class="ns-tab-pill ${tab === 'conclusion' ? 'is-active' : ''}" data-act="sum-tab" data-tab="conclusion" data-pid="${p.id}">结论</button>
        <button type="button" class="ns-tab-pill ${tab === 'full' ? 'is-active' : ''}" data-act="sum-tab" data-tab="full" data-pid="${p.id}">全文</button>
        <button type="button" class="ns-tab-pill ${tab === 'sources' ? 'is-active' : ''}" data-act="sum-tab" data-tab="sources" data-pid="${p.id}">来源</button>
      </div>
      <div class="scroll-area" style="padding-bottom:68px;">${body}</div>
    `;
  }

  function renderOs1(p) {
    const os1 = p.data.os1;
    const prompts = ['今天重点是什么', '还有哪些待办'];
    return `
      ${renderTopBar(p)}
      <div style="padding:4px 18px 10px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
        <span style="font-size:15px;font-weight:800;color:var(--ns-amber-hi);">问答</span>
        <div style="display:flex;gap:6px;">
          <button type="button" class="${os1.mode === 'her' ? 'ns-amber-btn' : 'ns-ghost-btn'}" data-act="os1-mode" data-mode="her" data-pid="${p.id}">语音</button>
          <button type="button" class="${os1.mode === 'chat' ? 'ns-amber-btn' : 'ns-ghost-btn'}" data-act="os1-mode" data-mode="chat" data-pid="${p.id}">文字</button>
        </div>
      </div>
      <div class="scroll-area" style="padding:18px 20px 100px;display:flex;flex-direction:column;">
        ${os1.mode === 'her' ? `
          <div style="margin:auto 0;text-align:center;">
            <div style="width:146px;height:146px;margin:0 auto 22px;border-radius:50%;border:2px solid var(--ns-amber);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle, rgba(245,166,35,0.20), transparent 70%);color:var(--ns-amber-hi);cursor:pointer;" data-act="os1-pulse" data-pid="${p.id}">

            <div style="display:flex;justify-content:center;gap:8px;margin-top:24px;flex-wrap:wrap;">
              ${prompts.map(q => `<button type="button" class="ns-ghost-btn" data-act="os1-ask" data-q="${esc(q)}" data-pid="${p.id}">${esc(q)}</button>`).join('')}
            </div>
          </div>
        ` : `
          <div style="display:flex;flex-direction:column;gap:10px;flex:1;">
            ${os1.msgs.map(m => `<div style="align-self:${m.role === 'user' ? 'flex-end' : 'flex-start'};max-width:85%;padding:10px 13px;border-radius:12px;background:${m.role === 'user' ? 'var(--ns-amber)' : 'var(--ns-panel)'};color:${m.role === 'user' ? '#111214' : '#FFFFFF'};font-size:14px;line-height:1.55;">${esc(m.text)}</div>`).join('')}

          <div style="display:flex;gap:6px;margin:12px 0 8px;">
            ${prompts.map(q => `<button type="button" class="ns-ghost-btn" data-act="os1-ask" data-q="${esc(q)}" data-pid="${p.id}">${esc(q)}</button>`).join('')}
          </div>
          <div style="display:flex;gap:8px;">
            <input style="flex:1;padding:10px 12px;border:1px solid var(--ns-line);border-radius:10px;background:var(--ns-panel);color:#FFFFFF;font-size:14px;" placeholder="问任何事…" value="${esc(p.ui.chatInput)}" data-act="chat-input" data-pid="${p.id}">
            <button type="button" class="ns-amber-btn" data-act="chat-send" data-pid="${p.id}">发送</button>
          </div>
        `}
      </div>
      ${renderThumbDock(p)}
    `;
  }

  function renderSettings(p) {
    const st = p.data;
    const hw = st.hw;
    const set = st.settings;
    const devs = st.devices.filter(d => !d.isWatch || set.appleWatch);
    return `
      ${renderTopBar(p)}
      <div class="scroll-area" style="padding-bottom:100px;">
        <div style="padding:14px 18px;border-bottom:1px solid var(--ns-line);">
          ${hw.connectedId ? `
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;">
              <div><div style="font-size:15px;font-weight:700;">录音开关</div><div style="font-size:12px;color:var(--ns-muted);margin-top:2px;">${esc(hw.batteryText)}</div></div>
              <button type="button" class="ns-switch ${hw.recording ? 'is-on' : ''}" data-act="toggle-rec" data-pid="${p.id}"></button>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0 12px;font-size:13px;cursor:pointer;" data-act="manual-sync" data-pid="${p.id}"><span>同步录音</span><strong style="color:var(--ns-amber-hi);">${esc(hw.syncLabel)}</strong></div>
          ` : ''}
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${devs.map(d => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--ns-panel);border-radius:10px;"><span style="font-size:14px;font-weight:700;">${esc(d.model)}</span><button type="button" class="${hw.connectedId === d.id ? 'ns-amber-btn' : 'ns-ghost-btn'}" data-act="connect-dev" data-did="${d.id}" data-pid="${p.id}">${hw.connectedId === d.id ? '断开' : '连接'}</button></div>`).join('')}
          </div>
        </div>
        <div style="padding:14px 18px;">
          <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ns-line);font-size:14px;"><span>常用声纹</span><strong>${st.voiceprints.slots.filter(s => s.name).length}/5 已记住</strong></div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ns-line);font-size:14px;"><span>本机离线识别</span><strong>已就绪</strong></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ns-line);font-size:14px;"><span>自动关联相册</span><button type="button" class="ns-switch ${set.photoLink ? 'is-on' : ''}" data-act="toggle-photolink" data-pid="${p.id}"></button></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0 2px;font-size:14px;"><span>Apple Watch 联动</span><button type="button" class="ns-switch ${set.appleWatch ? 'is-on' : ''}" data-act="toggle-watch" data-pid="${p.id}"></button></div>
        </div>
      </div>
      ${renderThumbDock(p)}
    `;
  }

  function renderModal(p) {
    const m = p.ui.modal;
    if (!m) return '';
    const st = p.data;
    if (m === 'hw') {
      const hw = st.hw;
      const devs = st.devices.filter(d => !d.isWatch || st.settings.appleWatch);
      return `<div class="ns-modal-bg" data-act="close-modal" data-pid="${p.id}"><div class="ns-modal-sheet" data-act="noop"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h3 style="margin:0;font-size:17px;font-weight:800;">设备控制</h3><button type="button" class="ns-ghost-btn" data-act="close-modal" data-pid="${p.id}">关闭</button></div>${hw.connectedId ? `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ns-line);"><div><div style="font-size:14px;font-weight:700;">录音开关</div><div style="font-size:12px;color:var(--ns-muted);">${esc(hw.batteryText)}</div></div><button type="button" class="ns-switch ${hw.recording ? 'is-on' : ''}" data-act="toggle-rec" data-pid="${p.id}"></button></div><div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ns-line);font-size:13px;cursor:pointer;" data-act="manual-sync" data-pid="${p.id}"><span>同步</span><strong style="color:var(--ns-amber-hi);">${esc(hw.syncLabel)}</strong></div>` : `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ns-line);"><span style="font-size:14px;font-weight:700;">本机录音</span><button type="button" class="ns-switch ${hw.phoneRec ? 'is-on' : ''}" data-act="toggle-phone-rec" data-pid="${p.id}"></button></div>`}<div style="display:flex;flex-direction:column;gap:6px;margin-top:12px;">${devs.map(d => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--ns-panel);border-radius:8px;"><span style="font-size:13px;font-weight:700;">${esc(d.model)}</span><button type="button" class="${hw.connectedId === d.id ? 'ns-amber-btn' : 'ns-ghost-btn'}" data-act="connect-dev" data-did="${d.id}" data-pid="${p.id}">${hw.connectedId === d.id ? '断开' : '连接'}</button></div>`).join('')}</div></div></div>`;
    }
    if (m === 'rename') {
      const spk = st.speakers[p.ui.renameSpkId] || st.speakers.s1;
      return `<div class="ns-modal-bg" data-act="close-modal" data-pid="${p.id}"><div class="ns-modal-sheet" data-act="noop"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="margin:0;font-size:17px;font-weight:800;">这是谁</h3><button type="button" class="ns-ghost-btn" data-act="close-modal" data-pid="${p.id}">取消</button></div><input id="rename-input-${p.id}" style="width:100%;padding:10px 12px;border:1px solid var(--ns-line);border-radius:10px;background:var(--ns-panel);color:#FFFFFF;font-size:14px;" value="${esc(p.ui.renameDraft || spk.name || '')}" placeholder="输入称呼"><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;"><button type="button" class="ns-amber-btn" data-act="fill-hint" data-val="${esc(spk.hinted)}" data-pid="${p.id}">可能为 ${esc(spk.hinted)}</button>${st.voiceprints.recent.slice(0, 3).map(n => `<button type="button" class="ns-ghost-btn" data-act="fill-hint" data-val="${esc(n)}" data-pid="${p.id}">${esc(n)}</button>`).join('')}</div><label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;"><input type="checkbox" ${p.ui.renameRemember ? 'checked' : ''} data-act="tog-rem-vp" data-pid="${p.id}">记住声纹</label><button type="button" class="ns-amber-btn" style="width:100%;padding:10px;margin-top:14px;font-size:14px;" data-act="confirm-rename" data-pid="${p.id}">确认</button></div></div>`;
    }
    if (m === 'export') {
      return `<div class="ns-modal-bg" data-act="close-modal" data-pid="${p.id}"><div class="ns-modal-sheet" data-act="noop"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="margin:0;font-size:17px;font-weight:800;">导出</h3><button type="button" class="ns-ghost-btn" data-act="close-modal" data-pid="${p.id}">取消</button></div><div style="display:flex;flex-direction:column;gap:8px;">${['完整文档', 'Markdown', 'PDF', '分享长图'].map(f => `<button type="button" class="ns-ghost-btn" style="padding:10px;text-align:left;font-size:14px;" data-act="do-export" data-fmt="${esc(f)}" data-pid="${p.id}">${esc(f)}</button>`).join('')}</div></div></div>`;
    }
    if (m === 'unclassified') {
      const unc = activeUnclassified(st)[0];
      return `<div class="ns-modal-bg" data-act="close-modal" data-pid="${p.id}"><div class="ns-modal-sheet" data-act="noop"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="margin:0;font-size:17px;font-weight:800;">归类照片</h3><button type="button" class="ns-ghost-btn" data-act="close-modal" data-pid="${p.id}">关闭</button></div>${unc ? `<img src="${ASSETS[unc.img] || ''}" alt="${esc(unc.caption)}" style="width:100%;height:150px;object-fit:cover;border-radius:10px;"><div style="font-size:14px;font-weight:700;margin-top:8px;">${esc(unc.caption)}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;"><button type="button" class="ns-amber-btn" style="padding:9px;" data-act="assign-unc" data-uid="${unc.id}" data-pid="${p.id}">归入晨间计划</button><button type="button" class="ns-ghost-btn" style="padding:9px;" data-act="dismiss-unc" data-uid="${unc.id}" data-pid="${p.id}">移除</button></div>` : ''}</div></div>`;
    }
    return '';
  }

  function renderPhoneHtml(p) {
    let body = '';
    if (p.ui.screen === 'home') body = renderHome(p);
    else if (p.ui.screen === 'detail') body = renderDetail(p);
    else if (p.ui.screen === 'summary') body = renderSummary(p);
    else if (p.ui.screen === 'os1') body = renderOs1(p);
    else body = renderSettings(p);

    const toast = p.ui.toast ? `<div style="position:absolute;left:20px;right:20px;bottom:86px;background:var(--ns-amber);color:#111214;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:800;z-index:45;text-align:center;">${esc(p.ui.toast)}</div>` : '';
    return renderIosShell({
      darkMode: true,
      screenBg: '#0B0C0F',
      islandRecording: p.data.hw.recording || p.data.hw.phoneRec,
      battery: 88
    }, `<div class="ns-app">${body}${renderModal(p)}${toast}</div>`);
  }

  function renderBoard() {
    const pos = {
      p1: { x: 72, y: 196, scale: 1.00 },
      p2: { x: 576, y: 132, scale: 0.80 },
      p3: { x: 1006, y: 212, scale: 0.80 },
      p4: { x: 576, y: 904, scale: 0.78 }
    };
    const phonesHtml = PHONE_SPECS.slice(0, 4).map(spec => {
      const ps = pos[spec.id];
      return `
        <div class="ns-slot" style="left:${ps.x}px;top:${ps.y}px;width:${Math.round(417 * ps.scale)}px;">
          <div class="ns-slot-title">${esc(spec.label)}</div>
          <div style="width:${Math.round(417 * ps.scale)}px;height:${Math.round(876 * ps.scale)}px;">
            <div class="ns-phone-scale" style="transform:scale(${ps.scale});">${renderPhoneHtml(phones[spec.id])}</div>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="board-canvas ns-board">
        <div class="ns-header">
          <h1 class="ns-title">暗房 Nocturne</h1>
          <p class="ns-lede">纯黑去框，用一条 6px 声学能量尺标出关键打点。</p>
        </div>
        ${phonesHtml}
      </div>
    `;
  }

  function renderSingle() {
    const p = phones[activeSingleId];
    return `
      <div class="single-stage">
        <div class="single-sidebar">
          <h2 style="margin:0;font-size:20px;font-weight:800;color:#FFFFFF;">暗房 Nocturne</h2>
          <p style="margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--ns-muted);">1:1 单机体验，点任意按钮切换页面。</p>
          <div class="single-jump">
            ${PHONE_SPECS.map(s => `<button type="button" class="single-jump-btn ${activeSingleId === s.id ? 'is-active' : ''}" data-act="pick-single" data-pid="${s.id}">${esc(s.label)}</button>`).join('')}
          </div>
        </div>
        <div>${renderPhoneHtml(p)}</div>
      </div>
    `;
  }

  function renderAll() {
    const stage = document.getElementById('stage-wrap');
    const scrollMap = {};
    stage.querySelectorAll('.scroll-area').forEach((el, idx) => { scrollMap[idx] = el.scrollTop; });
    const y = window.scrollY;
    stage.innerHTML = viewMode === 'board' ? renderBoard() : renderSingle();
    stage.querySelectorAll('.scroll-area').forEach((el, idx) => { if (scrollMap[idx]) el.scrollTop = scrollMap[idx]; });
    if (window.scrollY !== y) window.scrollTo(0, y);
    document.getElementById('btn-mode-board').classList.toggle('is-active', viewMode === 'board');
    document.getElementById('btn-mode-single').classList.toggle('is-active', viewMode === 'single');
  }

  document.getElementById('btn-mode-board').addEventListener('click', () => { viewMode = 'board'; renderAll(); });
  document.getElementById('btn-mode-single').addEventListener('click', () => { viewMode = 'single'; renderAll(); });
  document.getElementById('stage-wrap').addEventListener('input', (e) => {
    const el = e.target.closest('[data-act="chat-input"]');
    if (el && phones[el.dataset.pid]) phones[el.dataset.pid].ui.chatInput = el.value;
  });

  document.getElementById('stage-wrap').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'noop') return;
    const pid = btn.dataset.pid;
    if (act === 'pick-single') { activeSingleId = pid; renderAll(); return; }
    const p = phones[pid];
    if (!p) return;
    const st = p.data;

    if (act === 'nav') { p.ui.screen = btn.dataset.screen; p.ui.modal = null; }
    else if (act === 'toggle-selmode') { p.ui.selectMode = !p.ui.selectMode; }
    else if (act === 'toggle-sel') {
      const i = p.ui.selectedIds.indexOf(btn.dataset.eid);
      if (i >= 0) p.ui.selectedIds.splice(i, 1); else p.ui.selectedIds.push(btn.dataset.eid);
    } else if (act === 'run-summary') {
      const sum = generateSummaryFromSelection(st, p.ui.selectedIds);
      if (sum) { p.ui.selectMode = false; p.ui.sumId = sum.id; p.ui.sumTab = 'conclusion'; p.ui.screen = 'summary'; }
      else { showToast(p, '先选一段录音'); return; }
    } else if (act === 'open-detail') { p.ui.detailId = btn.dataset.eid; p.ui.detailTab = 'dlg'; p.ui.screen = 'detail'; }
    else if (act === 'det-tab') { p.ui.detailTab = btn.dataset.tab; }
    else if (act === 'scrub-seg') { p.ui.scrubHotIdx = Number(btn.dataset.idx); }
    else if (act === 'toggle-raw-play') { p.ui.rawPlaying = !p.ui.rawPlaying; }
    else if (act === 'open-summary') { p.ui.sumId = btn.dataset.sid; p.ui.sumTab = 'conclusion'; p.ui.screen = 'summary'; }
    else if (act === 'sum-tab') { p.ui.sumTab = btn.dataset.tab; }
    else if (act === 'toggle-todo') {
      const sum = st.summaries.find(s => s.id === p.ui.sumId) || st.summaries[0];
      const td = sum.todos.find(t => t.id === btn.dataset.tid); if (td) td.done = !td.done;
    } else if (act === 'open-hw') { p.ui.modal = 'hw'; }
    else if (act === 'open-rename') { p.ui.renameSpkId = btn.dataset.spkid; p.ui.renameDraft = st.speakers[btn.dataset.spkid]?.name || ''; p.ui.modal = 'rename'; }
    else if (act === 'fill-hint') { p.ui.renameDraft = btn.dataset.val; const inp = document.getElementById(`rename-input-${p.id}`); if (inp) inp.value = btn.dataset.val; return; }
    else if (act === 'tog-rem-vp') { p.ui.renameRemember = btn.checked; return; }
    else if (act === 'confirm-rename') {
      const inp = document.getElementById(`rename-input-${p.id}`);
      const val = inp ? inp.value : p.ui.renameDraft;
      applySpeakerRename(st, p.ui.renameSpkId, val, p.ui.renameRemember);
      p.ui.modal = null; showToast(p, `已改名为「${val || '未区分'}」`); return;
    } else if (act === 'exclude-photo') {
      const ev = st.events.find(x => x.id === btn.dataset.eid);
      const ph = ev?.photos.find(x => x.id === btn.dataset.phid);
      if (ph) { ph.excluded = true; st.unclassifiedPhotos.push({ id: 'unc-' + ph.id, time: ph.time, img: ph.img, caption: ph.caption, suggestedEventId: ev.id, dismissed: false }); showToast(p, '已移出到待归类'); return; }
    } else if (act === 'open-unc') { p.ui.modal = 'unclassified'; }
    else if (act === 'assign-unc') {
      const u = st.unclassifiedPhotos.find(x => x.id === btn.dataset.uid);
      if (u) { u.dismissed = true; (st.events.find(x => x.id === u.suggestedEventId) || st.events[0]).photos.push({ id: u.id, time: u.time, afterTurn: 0, img: u.img, caption: u.caption, excluded: false }); }
      p.ui.modal = null; showToast(p, '已归入晨间计划'); return;
    } else if (act === 'dismiss-unc') {
      const u = st.unclassifiedPhotos.find(x => x.id === btn.dataset.uid); if (u) u.dismissed = true; p.ui.modal = null;
    } else if (act === 'open-export') { p.ui.modal = 'export'; }
    else if (act === 'do-export') { p.ui.modal = null; showToast(p, `已导出 ${btn.dataset.fmt}`); return; }
    else if (act === 'close-modal') { p.ui.modal = null; }
    else if (act === 'toggle-rec') {
      if (!st.hw.connectedId) { st.hw.phoneRec = !st.hw.phoneRec; st.hw.recording = st.hw.phoneRec; }
      else { st.hw.recording = !st.hw.recording; }
      showToast(p, st.hw.recording ? '开始录音' : '已停录并同步'); return;
    } else if (act === 'toggle-phone-rec') { st.hw.phoneRec = !st.hw.phoneRec; showToast(p, st.hw.phoneRec ? '本机录音中' : '已停止'); return; }
    else if (act === 'manual-sync') { triggerManualSync(st, renderAll); return; }
    else if (act === 'connect-dev') { st.hw.connectedId = st.hw.connectedId === btn.dataset.did ? null : btn.dataset.did; st.hw.recording = false; }
    else if (act === 'toggle-photolink') { st.settings.photoLink = !st.settings.photoLink; }
    else if (act === 'toggle-watch') { st.settings.appleWatch = !st.settings.appleWatch; }
    else if (act === 'os1-mode') { st.os1.mode = btn.dataset.mode; }
    else if (act === 'os1-pulse') { st.os1.listening = !st.os1.listening; }
    else if (act === 'os1-ask') { st.os1.mode = 'chat'; st.os1.msgs.push({ role: 'user', text: btn.dataset.q }, { role: 'her', text: generateOs1Reply(st, btn.dataset.q) }); }
    else if (act === 'chat-send') {
      const q = (p.ui.chatInput || '').trim(); if (!q) return; p.ui.chatInput = '';
      st.os1.msgs.push({ role: 'user', text: q }, { role: 'her', text: generateOs1Reply(st, q) });
    }
    renderAll();
  });

  setInterval(() => {
    Object.values(phones).forEach(p => {
      if (p.data.hw.recording || p.data.hw.phoneRec) {
        p.data.hw.sec += 1;
        document.querySelectorAll(`[data-live-clock="${p.id}"]`).forEach(el => { el.textContent = formatHms(p.data.hw.sec); });
      }
    });
  }, 1000);

  renderAll();
})();

  </script>
  <script>
    (function () {
      var wWrap = document.getElementById('watch-stage-wrap');
      var sWrap = document.getElementById('stage-wrap');
      var btnBoard = document.getElementById('btn-mode-board');
      var btnSingle = document.getElementById('btn-mode-single');
      var btnWatch = document.getElementById('btn-mode-watch');
      if (!wWrap || !btnWatch || !window.RCWatchEngine) return;

      var themeId = 'dir4';
      var wTheme = RCWatchEngine.THEMES[themeId];
      var wState = RCWatchEngine.createState(themeId);
      var watchActive = false;

      function renderWatchPane() {
        wWrap.innerHTML =
          '<div class="watch-stage-outer">' +
            '<div class="watch-stage-head">' +
              '<div>' +
                '<h2>' + wTheme.name + ' Apple Watch 端</h2>' +
                '<p>' + wTheme.line + '</p>' +
              '</div>' +
              '<div class="watch-ctl-row">' +
                '<button type="button" class="watch-ctl-btn" data-dact="knock">敲表壳打点</button>' +
                '<button type="button" class="watch-ctl-btn' + (wState.aod ? ' is-on' : '') + '" data-dact="aod">息屏预览</button>' +
                '<button type="button" class="watch-ctl-btn" data-dact="cut">切 60s 切片</button>' +
                '<button type="button" class="watch-ctl-btn' + (!wState.phoneConnected ? ' is-on' : '') + '" data-dact="offline">' + (wState.phoneConnected ? '已连手机' : '离线暂存') + '</button>' +
              '</div>' +
            '</div>' +
            '<div id="dir-watch-mount">' + RCWatchEngine.renderShowcaseHtml(wState) + '</div>' +
          '</div>';
        var mount = document.getElementById('dir-watch-mount');
        RCWatchEngine.bind(mount, function () { return wState; }, renderWatchPane);
      }

      wWrap.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-dact]');
        if (!b) return;
        var a = b.dataset.dact;
        if (a === 'knock') RCWatchEngine.triggerKnock(wState, renderWatchPane);
        else if (a === 'aod') { wState.aod = !wState.aod; renderWatchPane(); }
        else if (a === 'cut') RCWatchEngine.cutSlice(wState, renderWatchPane);
        else if (a === 'offline') { wState.phoneConnected = !wState.phoneConnected; renderWatchPane(); }
      });

      setInterval(function () {
        if (!watchActive || !wState.isRec) return;
        wState.elapsedSec += 1;
        renderWatchPane();
      }, 1000);

      function showWatch() {
        watchActive = true;
        sWrap.hidden = true;
        wWrap.hidden = false;
        btnBoard.classList.remove('is-active');
        btnSingle.classList.remove('is-active');
        btnWatch.classList.add('is-active');
        renderWatchPane();
      }

      function hideWatch() {
        watchActive = false;
        wWrap.hidden = true;
        sWrap.hidden = false;
        btnWatch.classList.remove('is-active');
      }

      btnWatch.addEventListener('click', showWatch);
      btnBoard.addEventListener('click', hideWatch);
      btnSingle.addEventListener('click', hideWatch);

      if (new URLSearchParams(window.location.search).get('mode') === 'watch') {
        showWatch();
      }
    })();
  </script>
</body>
</html>
