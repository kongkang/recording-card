<html><head><meta charset="utf-8"><title>recording-card promo renderer</title>

<canvas id="c"></canvas>
<script>
'use strict';
const W=1920,H=1080;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
const TAU=Math.PI*2;

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eOut=p=>1-Math.pow(1-p,3);
const eOutQuint=p=>1-Math.pow(1-p,5);
const eOutExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
const eIn=p=>p*p*p;
const eInOut=p=>p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
function font(w,s,fam){return `${w} ${s}px ${fam||'"PingFang SC","Hiragino Sans GB","Heiti SC",sans-serif'}`;}
const MONO='"SF Mono",Menlo,Consolas,monospace';
function setFont(w,s,fam,ls){ctx.font=font(w,s,fam);try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}}
function text(str,x,y,o){o=o||{};setFont(o.w||600,o.s||40,o.fam,o.ls);ctx.fillStyle=o.c||'#111';ctx.textAlign=o.align||'left';ctx.textBaseline=o.base||'alphabetic';ctx.fillText(str,x,y);}
function tw(str,w,s,fam,ls){setFont(w,s,fam,ls);return ctx.measureText(str).width;}
function wrap(str,maxW,w,s,fam){setFont(w,s,fam);const out=[];let line='';for(const ch of str){if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}else{line+=ch;}}if(line)out.push(line);return out;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function card(x,y,w,h,r,fill,o){o=o||{};ctx.save();if(o.shadow){ctx.shadowColor=o.shadow;ctx.shadowBlur=o.blur!=null?o.blur:40;ctx.shadowOffsetY=o.dy!=null?o.dy:16;}ctx.fillStyle=fill;rrect(x,y,w,h,r);ctx.fill();ctx.restore();if(o.border){ctx.strokeStyle=o.border;ctx.lineWidth=o.bw||2;rrect(x,y,w,h,r);ctx.stroke();}}
function circle(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function line(x1,y1,x2,y2,c,w){ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function dash(x1,y1,x2,y2,c,w,dash,off){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.setLineDash(dash||[10,10]);ctx.lineDashOffset=off||0;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}

/* waveform bars */
function wave(x,y,w,h,t,color,seed,amp,bars){seed=seed||1;amp=amp==null?1:amp;bars=bars||44;const rnd=mulberry32(seed);const bw=w/bars;ctx.fillStyle=color;for(let i=0;i<bars;i++){const base=0.3+0.7*rnd();const ph=Math.sin(t*6.5+i*0.85)*0.5+0.5;const v=base*amp*(0.30+0.70*ph);const bh=Math.max(3,h*v);const bx=x+i*bw+bw*0.22;ctx.beginPath();ctx.roundRect(bx,y+h/2-bh/2,bw*0.56,bh,bw*0.28);ctx.fill();}}

/* hardware card device mock (landscape card recorder) */
function hwCard(cx,cy,s,o){o=o||{};const t=o.t||0;const w=430*s,h=270*s;
 ctx.save();ctx.translate(cx,cy);if(o.tilt)ctx.rotate(o.tilt);
 if(o.float!==false)ctx.translate(0,Math.sin(t*1.3)*5*s);
 const g=ctx.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'#F8F9FB');g.addColorStop(1,'#D6DAE1');
 ctx.save();ctx.shadowColor=o.dark?'rgba(0,0,0,0.6)':'rgba(30,40,70,0.30)';ctx.shadowBlur=70*s;ctx.shadowOffsetY=26*s;
 ctx.fillStyle=g;rrect(-w/2,-h/2,w,h,36*s);ctx.fill();ctx.restore();
 ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2*s;rrect(-w/2+1,-h/2+1,w-2,h-2,35*s);ctx.stroke();
 /* screen */
 const sw=w*0.55,sh=h*0.40,sx=-sw/2,sy=-h*0.38;
 ctx.fillStyle='#0E1216';rrect(sx,sy,sw,sh,14*s);ctx.fill();
 const wc=o.rec?'#2EE6A6':'#3A4550';wave(sx+14*s,sy+10*s,sw-28*s,sh-44*s,t,wc,7,1,24);
 if(o.rec){const on=Math.sin(t*5)>-0.25;if(on){circle(sx+18*s,sy+sh-14*s,4.5*s,'#FF4D5E');}ctx.fillStyle='#9AA5AE';ctx.font=`600 ${12*s}px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('REC',(sx+30*s),(sy+sh-9*s));}
 /* mic holes */
 ctx.fillStyle='rgba(80,90,105,0.55)';for(let i=0;i<6;i++){circle(-w*0.32+i*w*0.045,h*0.33,3.2*s,'rgba(90,100,115,0.5)');}
 /* brand */
 ctx.fillStyle='#5A6470';ctx.font=`700 ${15*s}px "PingFang SC",sans-serif`;ctx.textAlign='right';ctx.textBaseline='alphabetic';ctx.fillText('录音卡',w/2-20*s,h/2-18*s);
 if(o.sweep!=null&&o.sweep>0&&o.sweep<1){const gx=-w/2+o.sweep*(w+200)-100;ctx.save();rrect(-w/2,-h/2,w,h,36*s);ctx.clip();const lg=ctx.createLinearGradient(gx-120,0,gx+120,0);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(0.5,'rgba(255,255,255,0.5)');lg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=lg;ctx.fillRect(-w/2,-h/2,w,h);ctx.restore();}
 ctx.restore();}

/* phone frame; uiFn receives (sx,sy,sw,sh) local coords */
function phone(cx,cy,w,h,uiFn,o){o=o||{};const x=cx-w/2,y=cy-h/2;const r=w*0.155;
 ctx.save();
 ctx.shadowColor=o.dark?'rgba(0,0,0,0.65)':'rgba(20,30,60,0.28)';ctx.shadowBlur=60;ctx.shadowOffsetY=24;
 ctx.fillStyle='#0B0D10';rrect(x,y,w,h,r);ctx.fill();
 ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=2;rrect(x+1,y+1,w-2,h-2,r-1);ctx.stroke();
 const m=w*0.034;const sx=x+m,sy=y+m,sw=w-2*m,sh=h-2*m,sr=r-m*0.9;
 ctx.save();rrect(sx,sy,sw,sh,sr);ctx.clip();uiFn(sx,sy,sw,sh);ctx.restore();
 ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx+sw/2,sy+16,w*0.016,0,TAU);ctx.fill();
 ctx.restore();}

/* small icons */
function checkIcon(x,y,r,c,lw){lw=lw||r*0.28;ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-r*0.45,y+r*0.02);ctx.lineTo(x-r*0.08,y+r*0.38);ctx.lineTo(x+r*0.5,y-r*0.35);ctx.stroke();ctx.lineCap='butt';}
function lockIcon(x,y,s,c){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=s*0.22;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y-s*0.32,s*0.30,Math.PI,0);ctx.stroke();rrect(x-s*0.42,y-s*0.28,s*0.84,s*0.62,s*0.16);ctx.fill();ctx.restore();}
function cloudIcon(x,y,s,c,fill){ctx.save();ctx.fillStyle=fill||'none';ctx.strokeStyle=c;ctx.lineWidth=s*0.09;ctx.beginPath();ctx.arc(x-s*0.30,y,s*0.26,Math.PI*0.5,Math.PI*1.5);ctx.arc(x-s*0.02,y-s*0.16,s*0.30,Math.PI*0.8,Math.PI*1.95);ctx.arc(x+s*0.30,y-s*0.02,s*0.24,Math.PI*1.4,Math.PI*0.5);ctx.lineTo(x+s*0.30,y+s*0.16);ctx.lineTo(x-s*0.30,y+s*0.16);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.stroke();ctx.restore();}
function fingerprint(x,y,r,p,c){ctx.strokeStyle=c;ctx.lineCap='round';for(let i=1;i<=4;i++){const rr=r*i/4;ctx.lineWidth=r*0.09;ctx.beginPath();ctx.arc(x,y,rr,-Math.PI*0.6,-Math.PI*0.6+TAU*0.78*p*Math.min(1,i/2.4));ctx.stroke();}ctx.lineCap='butt';}
function sparkle(x,y,r,c,p){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(p*0.6);ctx.fillStyle=c;const k=Math.sin(Math.min(1,p)*Math.PI);ctx.beginPath();for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.lineTo(Math.cos(a)*r*k,Math.sin(a)*r*k);ctx.lineTo(Math.cos(a+Math.PI/4)*r*0.28*k,Math.sin(a+Math.PI/4)*r*0.28*k);}ctx.closePath();ctx.fill();ctx.restore();}
function grain(alpha,seedOffset){const rnd=mulberry32(1234+ (seedOffset||0));ctx.fillStyle=`rgba(255,255,255,${alpha})`;for(let i=0;i<260;i++){ctx.fillRect(rnd()*W,rnd()*H,1.6,1.6);}ctx.fillStyle=`rgba(0,0,0,${alpha})`;for(let i=0;i<260;i++){ctx.fillRect(rnd()*W,rnd()*H,1.6,1.6);}}
function scanlines(){ctx.fillStyle='rgba(255,255,255,0.016)';for(let y=0;y<H;y+=4){ctx.fillRect(0,y,W,1);}}
function progressBar(t,dur,c,fade){ctx.save();ctx.globalAlpha=1-(fade||0);ctx.fillStyle=c||'rgba(120,130,150,0.35)';ctx.fillRect(0,H-5,W*(t/dur),5);ctx.restore();}
function bgGrad(c1,c2){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function radial(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}

/* generic chip */
function chip(cx,cy,w,h,label,opts){const o2=opts||{};const p=o2.p==null?1:o2.p;ctx.save();ctx.translate(cx,cy);ctx.scale(0.6+0.4*p,0.6+0.4*p);ctx.globalAlpha=Math.min(1,p*1.6);
 card(-w/2,-h/2,w,h,h/2,o2.bg||'#FFFFFF',{border:o2.border||'rgba(0,0,0,0.08)',bw:2,shadow:o2.shadow,blur:o2.blur,dy:o2.dy});
 if(o2.check){circle(-w/2+44,0,h*0.28,o2.checkBg||'#17B26A');checkIcon(-w/2+44,0,h*0.30,'#fff');text(label,-w/2+80,h*0.14,{s:o2.s||40,w:600,c:o2.c||'#101114'});}
 else if(o2.dot){circle(-w/2+44,0,h*0.18,o2.dot);text(label,-w/2+74,h*0.14,{s:o2.s||40,w:600,c:o2.c||'#101114'});}
 else{text(label,0,h*0.14,{s:o2.s||40,w:600,c:o2.c||'#101114',align:'center'});}
 ctx.restore();}

  const uW=tw('纪要还没写。',700,112),uP=eOutQuint(seg(t,0.95,1.4));
  if(uP>0){ctx.fillStyle=RED;rrect(960-uW/2,648,uW*uP,13,6);ctx.fill();}
  ctx.restore();}
 /* B notes */
 if(t>=2.6&&t<5.65){const bOut=seg(t,5.25,5.62);ctx.save();ctx.globalAlpha=1-bOut;
  const notes=[
   {x:430,y:330,r:-0.09,bg:'#FFE58A',txt:'谁负责？',d:0},

  notes.forEach((n,i)=>{const p=eBack(seg(t,2.65+n.d,3.15+n.d));if(p<=0)return;ctx.save();ctx.translate(n.x,n.y+ (1-p)*160);ctx.rotate(n.r);ctx.scale(p,p);
   card(-160,-105,320,210,18,n.bg,{shadow:'rgba(60,50,20,0.18)',blur:30,dy:14});
   text(n.txt,0,14,{s:44,w:600,c:'#3A3324',align:'center',base:'middle'});ctx.restore();});
  const cp=seg(t,3.7,4.2);ctx.save();ctx.globalAlpha*=cp;ctx.translate(0,(1-eOut(cp))*30);
  text('散会后，全靠回忆。',960,940,{s:46,w:600,c:SUB,align:'center',base:'middle'});ctx.restore();
  ctx.restore();}
 /* C device */
 if(t>=5.6&&t<8.45){const p=eOutQuint(seg(t,5.65,6.3));const x=lerp(380,960,p);
  for(let i=0;i<2;i++){const rp=(t*1.1+i*0.5)%1;if(rp>0&&rp<1){ctx.strokeStyle=hexA('#2B5CFF',0.28*(1-rp));ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,470,240*s0(p)+rp*220,0,TAU);ctx.stroke();}}
  hwCard(x,470,1.5,{t,rec:true,tilt:-0.02});
  const cp=seg(t,6.5,7.0);ctx.save();ctx.globalAlpha=cp;ctx.translate(0,(1-eOut(cp))*26);
  text('一放，就开录。',960,806,{s:58,w:700,c:INK,align:'center',base:'middle'});
  text('蓝牙实时音频流 · 1 分钟一段',960,872,{s:32,w:500,c:SUB,align:'center',base:'middle'});ctx.restore();}
 function s0(p){return 0.9+0.1*p;}
 /* D app demo */
 if(t>=8.4&&t<14.45){const dOut=seg(t,14.05,14.42);ctx.save();ctx.globalAlpha=1-dOut;
  const sp=eOutQuint(seg(t,8.45,9.05));const hwX=lerp(960,390,sp),hwS=lerp(1.5,0.85,sp);

  text('说话人自动区分（推测）',390,768,{s:31,w:500,c:SUB,align:'center',base:'middle'});
  text('原始录音可回听',390,818,{s:31,w:500,c:SUB,align:'center',base:'middle'});ctx.restore();
  const pp=eOutQuint(seg(t,8.45,9.05));const phX=lerp(2350,1310,pp);
  phone(phX,540,470,950,(sx,sy,sw,sh)=>{
   ctx.fillStyle='#F4F6F8';ctx.fillRect(sx,sy,sw,sh);

   cards.forEach(c=>{const p=eBack(seg(t,9.15+c.d,9.62+c.d));if(p<=0)return;ctx.save();ctx.translate(0,(1-p)*70);ctx.globalAlpha=Math.min(1,p*2);

    ctx.restore();});

    ['给老板发周报 ✓','确认预算上限 ✓','周三前出方案 ✓'].forEach((lb,i)=>{const p=seg(t,13.1+i*0.18,13.35+i*0.18);if(p<=0)return;ctx.save();ctx.globalAlpha=Math.min(1,p*2);ctx.translate(0,(1-eOut(p))*16);
     text(lb,sx+52,sy+406+i*52,{s:25,w:500,c:'#3C4046'});ctx.restore();});

  },{});
  ctx.restore();}
 /* E summary big */
 if(t>=14.4&&t<17.85){const dOut=seg(t,17.45,17.82);ctx.save();ctx.globalAlpha=1-dOut;
  const p=eOutQuint(seg(t,14.45,15.0));ctx.save();ctx.translate(960,540);ctx.scale(0.9+0.1*p,0.9+0.1*p);ctx.globalAlpha=Math.min(1,p*2);ctx.translate(-960,-540);
  card(360,180,1200,720,30,'#FFFFFF',{shadow:'rgba(20,30,60,0.14)',blur:60,dy:24});

/* 展示一张真实截图：圆角设备卡，contain 适配，轻微推进 */
function shotCard(key,cx,cy,maxW,maxH,t01,dur,bg,radius){
 const s=window.SHOT[key];if(!s)return;
 const im=s.img,ih=im.height,y0=s.y0*ih,y1=s.y1*ih,sw=im.width,sh=y1-y0;
 const k=Math.min(maxW/sw,maxH/sh),dw=sw*k,dh=sh*k;

 const zoom=1.02+0.03*eInOut(p);
 ctx.save();ctx.globalAlpha=fade;ctx.translate(cx,cy+rise);
 ctx.shadowColor='rgba(15,20,35,0.30)';ctx.shadowBlur=50;ctx.shadowOffsetY=22;
 ctx.fillStyle=bg||'#0E1116';rrect(-dw/2-11,-dh/2-11,dw+22,dh+22,20+(radius||0));ctx.fill();
 ctx.shadowColor='transparent';
 rrect(-dw/2,-dh/2,dw,dh,14);ctx.clip();
 const z=zoom;ctx.translate(0,0);ctx.scale(z,z);
 ctx.drawImage(im,0,y0,sw,sh,-dw/2/z,-dh/2/z,dw/z,dh/z);
 ctx.restore();

 ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=2;rrect(-dw/2-11,-dh/2-11,dw+22,dh+22,20);ctx.stroke();
 ctx.restore();
}

/* ============ 场景片 v2：纸感背景 + 编号水印 + 手机框（统一浅色，accent 只做点缀） ============ */
function sceneNum(id){const n=id.slice(2);return n.length<2?'0'+n:n;}
function v2Backdrop(t,acc,num){
  bgGrad('#F8F7F3','#EFEEE9');
  radial(960,620,720,hexA(acc,0.09));
  /* 超大编号水印 */
  ctx.save();ctx.globalAlpha=Math.min(1,seg(t,0.1,0.6))*0.9;
  setFont(600,330,MONO,8);ctx.textAlign='right';ctx.textBaseline='alphabetic';
  ctx.strokeStyle='rgba(29,29,31,0.07)';ctx.lineWidth=2;ctx.strokeText(num,1850,960);ctx.restore();
  /* 暗角 */
  const v=ctx.createRadialGradient(960,540,420,960,540,1180);
  v.addColorStop(0,'rgba(20,22,26,0)');v.addColorStop(1,'rgba(20,22,26,0.07)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function v2Kicker(t,txt,acc){const p=seg(t,0.15,0.5);if(p<=0)return;
  ctx.save();ctx.globalAlpha=Math.min(1,p*2);
  setFont(600,22,MONO,5);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=acc;ctx.fillText(txt,960,84);
  ctx.strokeStyle=hexA(acc,0.5);ctx.lineWidth=2;
  const lw=64*eOut(p);ctx.beginPath();ctx.moveTo(960-lw/2,108);ctx.lineTo(960+lw/2,108);ctx.stroke();
  ctx.restore();}
function v2Phone(key,cx,cy,h,lt,slot){
  const s=window.SHOT[key];if(!s)return;
  const im=s.img,ih=im.height,y0=s.y0*ih,y1=s.y1*ih,sw=im.width,sh=y1-y0;
  const srcAspect=sw/sh;
  const bez=Math.round(h*0.018);
  const scrH=h-bez*2;
  const devAspect=clamp(srcAspect,0.42,0.95);
  const scrW=scrH*devAspect;
  const dw=scrW+bez*2,dh=h;
  const rise=(1-eOutQuint(Math.min(1,lt/0.55)))*70;
  const fade=Math.min(1,lt/0.35)*Math.min(1,(slot-lt)/0.3);
  if(fade<=0)return;
  /* 地面投影 */
  ctx.save();ctx.globalAlpha=fade;ctx.filter='blur(16px)';
  ctx.fillStyle='rgba(15,18,24,0.30)';
  ctx.beginPath();ctx.ellipse(cx,cy+dh/2+14,dw*0.42,20,0,0,TAU);ctx.fill();
  ctx.filter='none';ctx.restore();
  ctx.save();ctx.globalAlpha=fade;ctx.translate(cx,cy+rise);
  const sc=0.975+0.025*eOutQuint(Math.min(1,lt/0.55));ctx.scale(sc,sc);
  ctx.shadowColor='rgba(15,20,35,0.35)';ctx.shadowBlur=46;ctx.shadowOffsetY=20;
  ctx.fillStyle='#14161B';rrect(-dw/2,-dh/2,dw,dh,h*0.07);ctx.fill();
  ctx.shadowColor='transparent';
  rrect(-dw/2+bez,-dh/2+bez,scrW,scrH,h*0.07-bez);ctx.clip();
  const zoom=1.015+0.03*eInOut(clamp(lt/slot,0,1));
  ctx.drawImage(im,0,y0,sw,sh,-scrW/2*zoom,-(scrH/2)*zoom,scrW*zoom,scrH*zoom);
  /* 高光扫过 */
  const swp=((lt-0.7)/slot)%1;
  if(swp>0&&swp<0.35){const gx=-scrW/2+((swp/0.35))*scrW*1.6;
    const lg=ctx.createLinearGradient(gx-90,0,gx+90,0);
    lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(0.5,'rgba(255,255,255,0.16)');lg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=lg;ctx.fillRect(-scrW/2,-dh/2,scrW,dh);}
  ctx.restore();
  ctx.save();ctx.globalAlpha=fade;ctx.translate(cx,cy+rise);
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.6;
  rrect(-dw/2+1,-dh/2+1,dw-2,dh-2,h*0.07-1);ctx.stroke();
  ctx.restore();
}
function v2Caption(txt,lt,acc){const p=eOut(seg(lt,0.35,0.75));if(p<=0)return;

function v2Dots(shots,ltAll,acc){const n=shots.length;

function renderSceneV2(id,t){
  const s=SCENES[id];if(!s)return;
  const INK='#1D1D1F',INK2='#48484D',num=sceneNum(id),acc=s.acc;
  if(t<2.45){ /* 钩子：kicker + 双行标题 + 下划线 */

    s.hook.forEach((ln,i)=>{const p=eOut(seg(t,0.25+i*0.26,0.68+i*0.26));if(p<=0)return;
      ctx.save();ctx.globalAlpha=Math.min(1,p*2);ctx.translate(0,(1-p)*44);
      text(ln,960,428+i*122,{s:80,w:i===0?650:800,c:i===0?INK:acc,align:'center',base:'middle'});ctx.restore();});
    const up=eOutQuint(seg(t,1.05,1.7));
    if(up>0){const lw=tw(s.hook[1],800,80);

    const o=seg(t,2.18,2.42);ctx.save();ctx.globalAlpha=o;ctx.fillStyle='#F5F4EF';ctx.fillRect(0,0,W,H);ctx.restore();
  }else if(t<10.45){ /* 真实界面：手机框居中 + 编号水印 + 说明胶囊 */
    v2Backdrop(t,acc,num);v2Kicker(t,s.tag,acc);

    s.shots.forEach((sh,i)=>{

    text('AI Card · 录音卡',0,0,{s:92,w:750,c:INK,align:'center',base:'middle',ls:3});ctx.restore();
    ctx.save();ctx.globalAlpha=p;ctx.fillStyle=acc;
    const lw=110*eOutQuint(seg(t,10.9,11.25));rrect(960-lw/2,540,lw,6,3);ctx.fill();ctx.restore();
    const sp=seg(t,11.0,11.4);ctx.save();ctx.globalAlpha=sp*p;
    text(s.cta,960,626,{s:38,w:550,c:INK2,align:'center',base:'middle'});ctx.restore();
    const fp=seg(t,11.25,11.6);ctx.save();ctx.globalAlpha=fp*0.7*p;
    text('本地转写 · 云端润色 · 蓝牙实时音频流',960,952,{s:21,w:400,c:'#7A7A80',align:'center',base:'middle',fam:MONO,ls:2});ctx.restore();
  }
  grain(0.02,Math.floor(t*24));
}
